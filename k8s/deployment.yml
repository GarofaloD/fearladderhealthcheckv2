apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcheck
spec:
  replicas: 2
  selector: { matchLabels: { app: healthcheck } }
  template:
    metadata:
      labels: { app: healthcheck }
    spec:
      containers:
        - name: app
          image: ghcr.io/garofalod/fear-ladder-healthcheck:v0.1.0
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC"
---
apiVersion: v1
kind: Service
metadata:
  name: healthcheck
spec:
  selector: { app: healthcheck }
  ports:
    - port: 80
      targetPort: 8080
